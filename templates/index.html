{% extends "base.html" %}
{% block title %}NOGOK{% endblock %}
{% block content %}
<section class="hero hero-simple">
  <h1>NOGOK</h1>
</section>
<div class="grid">
  <section class="card">
    <h2>Recent</h2>
    {% for p in recent %}
      <a class="row" href="{{ url_for('wiki', title=p.title) }}"><span>{{ p.title }}</span><small>{{ p.updated_at }}</small></a>
    {% else %}<p>No pages.</p>{% endfor %}
  </section>
  <section class="card">
    <h2>Popular</h2>
    {% for p in popular %}
      <a class="row" href="{{ url_for('wiki', title=p.title) }}"><span>{{ p.title }}</span><small>{{ p.views }}</small></a>
    {% else %}<p>No pages.</p>{% endfor %}
  </section>
</div>
{% endblock %}
