{% extends "base.html" %}
{% block title %}{{ page.title }} 역사{% endblock %}
{% block content %}<section class="card"><h1>{{ page.title }} 역사</h1>{% for r in revisions %}<div class="revision"><b>{{ r.title }}</b> · {{ r.username or '알 수 없음' }} · {{ r.created_at }}<details><summary>이전 내용 보기</summary><pre>{{ r.content }}</pre></details></div>{% else %}<p>저장된 이전 버전이 없습니다.</p>{% endfor %}</section>{% endblock %}
