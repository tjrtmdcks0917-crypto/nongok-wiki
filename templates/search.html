{% extends "base.html" %}
{% block title %}검색 - NONGOK Wiki{% endblock %}
{% block content %}<section class="card"><h1>검색 결과</h1>{% if q %}<p><b>{{ q }}</b> 검색 결과</p>{% endif %}{% for p in results %}<a class="search-result" href="{{ url_for('wiki', title=p.title) }}"><h3>{{ p.title }}</h3><p>{{ p.content[:180] }}</p></a>{% else %}<p>검색 결과가 없습니다.</p>{% endfor %}</section>{% endblock %}
