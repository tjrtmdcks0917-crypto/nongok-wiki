{% extends "base.html" %}
{% block title %}학생 정보 등록 - NONGOK Wiki{% endblock %}
{% block robots %}noindex,nofollow{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <h1>학생 정보 등록</h1>
      <p>기존 계정도 책임 있는 이용을 위해 이름과 학번을 한 번 등록해 주세요.</p>
    </div>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf" value="{{csrf}}">
      <label for="real_name">이름</label>
      <input id="real_name" name="real_name" maxlength="30" autocomplete="name" placeholder="실명" required autofocus>
      <label for="student_no">학번</label>
      <input id="student_no" name="student_no" maxlength="6" minlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="예: 100101" required>
      <div class="field-help">10/20/30 = 1/2/3학년, 01~04 = 반, 01~29 = 번호입니다. 학번은 관리자만 확인하며 공개 게시물에는 표시하지 않습니다.</div>
      <button class="auth-submit" type="submit">정보 등록하기</button>
    </form>
  </div>
</section>
{% endblock %}
